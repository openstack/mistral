exclude: '^tools/cookiecutter-mistral-custom/\{\{'
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: mixed-line-ending
        args: ['--fix', 'lf']
        exclude: '.*\.(svg)$'
      - id: fix-byte-order-marker
      - id: check-executables-have-shebangs
      - id: check-merge-conflict
      - id: debug-statements
      - id: check-yaml
        files: .*\.(yaml|yml)$
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.19
    hooks:
      - id: ruff-check
        args: ['--fix']
      - id: ruff-format
  - repo: https://github.com/PyCQA/doc8
    rev: v2.0.0
    hooks:
      - id: doc8
        files: ^(README\.rst|doc/source/.*\.rst|api-ref/source/.*\.(rst|inc|yaml)|releasenotes/(notes/.*\.yaml|source/.*\.rst))$
  - repo: https://opendev.org/openstack/hacking
    rev: 8.1.0
    hooks:
      - id: hacking
        additional_dependencies: []
        exclude: '^tools/'
