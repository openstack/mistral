<?xml version="1.0" encoding="UTF-8"?>
<!--
  Mistral architecture diagram.

  Hand-editable SVG on a regular grid:
    - all boxes are 130x90; columns start at x=10,180,350,520 (40px gaps)
    - external pieces (not Mistral itself) sit on the top band and use
      class="extbox": the database (fed by a shared bus rising from every
      component) and the http server in front of the api
    - RPC queues: class="queue" segmented red bars (19px high), all three
      on the same row (y=330); producers enter from the top or left,
      consumers leave from the bottom
    - data flows: class="flow" lines with an #arrowhead marker-end;
      class="link" lines are plain connectors (database bus and its rises)
-->
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink"
     viewBox="0 0 898 511" font-family="Arial, Helvetica, sans-serif">
  <style>
    .box      { fill: #2B608B; stroke: #000; stroke-width: 1; }
    .extbox   { fill: #6E6E6E; stroke: #000; stroke-width: 1; }
    .boxtext  { fill: #fff; font-size: 21px; font-weight: bold;
                text-anchor: middle; }
    .label    { fill: #000; font-size: 17px; font-weight: bold;
                text-anchor: middle; }
    .queue    { fill: #C00000; stroke: #000; stroke-width: 1; }
    .flow     { stroke: #000; stroke-width: 3; fill: none;
                marker-end: url(#arrowhead); }
    .link     { stroke: #000; stroke-width: 3; fill: none; }
    .dbtext   { fill: #fff; font-size: 10px; font-weight: bold;
                text-anchor: middle; }
  </style>

  <defs>
    <!-- Arrowhead for data-flow lines (marker-end) -->
    <marker id="arrowhead" markerUnits="userSpaceOnUse" markerWidth="18"
            markerHeight="14" refX="16" refY="7" orient="auto">
      <polygon points="0,0 18,7 0,14" fill="#000"/>
    </marker>
  </defs>

  <!-- ===================== Database (top band) ===================== -->
  <path class="extbox" d="M 180,28 v 66 a 65,18 0 0 0 130,0 v -66"/>
  <ellipse cx="245" cy="28" rx="65" ry="18"
           fill="#C4C4C4" stroke="#000" stroke-width="1"/>
  <text class="boxtext" x="245" y="58">Database</text>
  <text class="dbtext" x="245" y="72">workflows</text>
  <text class="dbtext" x="245" y="83">executions</text>
  <text class="dbtext" x="245" y="94">tasks</text>
  <text class="dbtext" x="245" y="105">crons etc.</text>

  <!-- engine / event engine / periodic / api <-> database:
       one rise per component onto a shared bus ending at the database -->
  <line class="link" x1="75"  y1="146" x2="75"  y2="122"/>
  <line class="link" x1="245" y1="146" x2="245" y2="122"/>
  <line class="link" x1="415" y1="146" x2="415" y2="122"/>
  <line class="link" x1="545" y1="146" x2="545" y2="122"/>
  <line class="link" x1="75"  y1="122" x2="545" y2="122"/>
  <line class="flow" x1="245" y1="122" x2="245" y2="112"/>

  <!-- http server (e.g. uwsgi/apache) in front of the api -->
  <rect class="extbox" x="520" y="10" width="130" height="90"/>
  <text class="boxtext" x="585" y="50">HTTP</text>
  <text class="boxtext" x="585" y="77">Server</text>
  <line class="flow" x1="615" y1="104" x2="615" y2="144"/>
  <text class="label" x="650" y="128">wsgi</text>

  <!-- ===================== Components ===================== -->
  <rect class="box" x="10" y="150" width="130" height="90"/>
  <text class="boxtext" x="75" y="203">Engine</text>

  <rect class="box" x="180" y="150" width="130" height="90"/>
  <text class="boxtext" x="245" y="190">Event</text>
  <text class="boxtext" x="245" y="217">Engine</text>

  <rect class="box" x="350" y="150" width="130" height="90"/>
  <text class="boxtext" x="415" y="203">Periodic</text>

  <rect class="box" x="520" y="150" width="130" height="90"/>
  <text class="boxtext" x="585" y="203">API</text>

  <!-- ===================== Queues row ===================== -->
  <!-- engine -> notification queue (down) -->
  <line class="flow" x1="40" y1="244" x2="40" y2="325"/>
  <!-- engine -> task queue (down, then right into its left end) -->
  <path class="flow" d="M 137,244 V 340 H 161"/>
  <!-- event engine -> workflow queue (small jog right) -->
  <path class="flow" d="M 305,244 V 270 H 330 V 325"/>
  <!-- periodic / api -> workflow queue (down) -->
  <line class="flow" x1="415" y1="244" x2="415" y2="325"/>
  <line class="flow" x1="585" y1="244" x2="585" y2="325"/>
  <!-- workflow queue -> engine (up the lane between engine and event
       engine, into the engine's right edge) -->
  <path class="flow" d="M 295,326 V 290 H 168 V 195 H 146"/>

  <g class="queue">
    <rect x="10" y="330" width="24" height="19"/>
    <rect x="34" y="330" width="24" height="19"/>
    <rect x="58" y="330" width="24" height="19"/>
    <rect x="82" y="330" width="24" height="19"/>
    <rect x="106" y="330" width="24" height="19"/>
  </g>
  <text class="label" x="105" y="369">Notification Queue</text>

  <text class="label" x="210" y="322">Task Queue</text>
  <g class="queue">
    <rect x="165" y="330" width="30" height="19"/>
    <rect x="195" y="330" width="30" height="19"/>
    <rect x="225" y="330" width="30" height="19"/>
  </g>

  <g class="queue">
    <rect x="285" y="330" width="50" height="19"/>
    <rect x="335" y="330" width="50" height="19"/>
    <rect x="385" y="330" width="50" height="19"/>
    <rect x="435" y="330" width="50" height="19"/>
    <rect x="485" y="330" width="50" height="19"/>
    <rect x="535" y="330" width="50" height="19"/>
    <rect x="585" y="330" width="50" height="19"/>
    <rect x="635" y="330" width="50" height="19"/>
    <rect x="685" y="330" width="50" height="19"/>
  </g>
  <text class="label" x="510" y="369">Workflow Queue</text>

  <!-- ===================== Consumers ===================== -->
  <!-- notification queue -> notifier -->
  <line class="flow" x1="25" y1="354" x2="25" y2="400"/>
  <rect class="box" x="10" y="405" width="130" height="90"/>
  <text class="boxtext" x="75" y="458">Notifier</text>

  <!-- task queue -> executor -->
  <line class="flow" x1="230" y1="354" x2="230" y2="400"/>
  <rect class="box" x="180" y="405" width="130" height="90"/>
  <text class="boxtext" x="245" y="458">Executor</text>
</svg>
