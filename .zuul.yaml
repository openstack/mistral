- job:
    name: mistral-docker-buildimage
    parent: publish-openstack-artifacts
    run: playbooks/docker-buildimage/run.yaml
    post-run: playbooks/docker-buildimage/post.yaml
    timeout: 1800
    required-projects:
      - openstack/mistral

- job:
    name: mistral-docker-buildimage-test
    run: playbooks/docker-buildimage/run.yaml
    post-run: playbooks/docker-buildimage/post.yaml
    timeout: 1800
    required-projects:
      - openstack/mistral

- project:
    templates:
      - openstack-python3-jobs
      - publish-openstack-docs-pti
      - api-ref-jobs
      - check-requirements
      - release-notes-jobs-python3
    check:
      jobs:
        - openstack-tox-cover:
            voting: false
            irrelevant-files:
              - ^\.gitignore$
              - ^\.gitreview$
              - ^.zuul.yaml$
              - ^.*\.rst$
              - ^api-ref/.*$
              - ^doc/.*$
              - ^releasenotes/.*$
        - mistral-devstack
        - mistral-devstack-tempest-ipv6-only
    queue: mistral
    gate:
      jobs:
        - mistral-devstack
        - mistral-devstack-tempest-ipv6-only
    post:
      jobs:
        - mistral-docker-buildimage:
            branches: master
    experimental:
      jobs:
        - mistral-docker-buildimage-test:
            branches: master
