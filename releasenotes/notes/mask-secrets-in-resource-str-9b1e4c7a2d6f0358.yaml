---
security:
  - |
    REST API resources no longer expose secret-bearing fields when they are
    logged. The controllers commonly log a resource with ``LOG.*("... %s",
    resource)``, and ``Resource.__str__`` used to render every attribute
    verbatim, including workflow ``input``, ``output``, ``params`` (which
    carries ``env``), ``result``, ``published`` / ``published_global`` and
    environment ``variables``. Those fields routinely hold client-supplied
    secrets (action passwords, API keys, tokens), so they were leaking into
    the logs on execution/task/action-execution create and update. These
    attributes are now masked (``***``) in ``__str__``.
