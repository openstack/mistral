---
security:
  - |
    Several logs and error messages that could leak secrets have been
    fixed:

    * Failing to instantiate an action no longer embeds the action input
      (which can hold ssh passwords/keys, HTTP ``Authorization`` headers,
      SMTP passwords, tokens) in the error - that error is also persisted
      in the API-visible task ``state_info``.
    * The ``std.http`` action no longer logs its ``auth`` (HTTP Basic
      password / bearer token), ``cookies`` or sensitive ``params`` in
      clear text.
    * The engine RPC client no longer logs the raw workflow input and
      params (which carry the ``env`` and action credentials) when
      starting a workflow.
    * The notification server now redacts publisher configuration
      (e.g. webhook ``headers`` such as ``X-Auth-Token``) before logging.
    * The Jinja evaluator no longer logs the rendered expression result at
      debug level, which could contain secrets from the workflow context.

    A new ``mistral.utils.redact.redact_sensitive`` helper masks the values
    of sensitive-looking keys (password, token, secret, auth, api_key,
    credential, cookie, private_key) in arbitrary data before logging.
