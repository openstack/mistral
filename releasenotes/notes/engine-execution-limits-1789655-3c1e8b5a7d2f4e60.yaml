---
features:
  - |
    New ``[engine]`` options let operators cap the load a single workflow
    execution can put on engines, executors and the message queue. All of
    them default to ``0``, which means no limit.

    * ``max_with_items_length``: maximum number of items a ``with-items``
      task can iterate over. If the list is longer, the task fails and
      ``on-error`` can handle it.
    * ``max_with_items_concurrency``: maximum number of actions a
      ``with-items`` task runs in parallel. A higher or missing
      ``concurrency`` is lowered to this value.
    * ``max_task_executions``: maximum number of times the same task can run
      within one workflow execution, for example in a loop. Above it, the
      task and the workflow fail without running ``on-error``, so that a
      loop cannot go on through it.
